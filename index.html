<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetupMarket - Desk & Tech Setups</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <style>
    .neumo-out { 
      background-color: #e0e5ec; 
      box-shadow: 6px 6px 12px #c3c8cf, -6px -6px 12px #fdffff; 
    }
    .neumo-in { 
      background-color: #e0e5ec; 
      box-shadow: inset 6px 6px 12px #c3c8cf, inset -6px -6px 12px #fdffff; 
    }
    .dark .neumo-out { 
      background-color: #1e293b; 
      box-shadow: 6px 6px 12px #0f172a, -6px -6px 12px #334155; 
    }
    .dark .neumo-in { 
      background-color: #1e293b; 
      box-shadow: inset 6px 6px 12px #0f172a, inset -6px -6px 12px #334155; 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes gradientShift {
      0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.2); filter: hue-rotate(45deg); }
      100% { transform: rotate(360deg) scale(1); filter: hue-rotate(0deg); }
    }
    .animate-orb-1 { animation: gradientShift 20s infinite linear; }
    .animate-orb-2 { animation: gradientShift 25s infinite linear reverse; }
    .animate-orb-3 { animation: gradientShift 30s infinite ease-in-out; }
  </style>
</head>
<body class="bg-[#e0e5ec] dark:bg-[#0f172a] text-slate-900 dark:text-white transition-colors duration-500 overflow-x-hidden font-sans selection:bg-pink-300">

  <!-- DYNAMIC ANIMATED BACKGROUND ORBS -->
  <div class="fixed top-[-10%] left-[-10%] w-[60vw] h-[60vw] bg-pink-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-30 dark:opacity-20 z-0 pointer-events-none animate-orb-1"></div>
  <div class="fixed top-[20%] right-[-10%] w-[50vw] h-[50vw] bg-cyan-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-30 dark:opacity-20 z-0 pointer-events-none animate-orb-2"></div>
  <div class="fixed bottom-[-10%] left-[20%] w-[70vw] h-[70vw] bg-purple-400 rounded-full mix-blend-multiply filter blur-[120px] opacity-30 dark:opacity-20 z-0 pointer-events-none animate-orb-3"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none hidden">
    <div id="toast-message" class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 shadow-2xl px-8 py-4 rounded-full font-black text-slate-800 dark:text-white">
      <!-- Toast Message -->
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app" class="relative z-10"></div>

  <!-- Javascript Logic -->
  <script>
    // --- AUDIO SYNTHESIZER ---
    let audioCtx = null;
    function playSwitchSound(type = 'brown') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;

        const thock = audioCtx.createOscillator();
        const thockGain = audioCtx.createGain();
        thock.type = 'sine';
        thock.connect(thockGain);
        thockGain.connect(audioCtx.destination);

        const tick = audioCtx.createOscillator();
        const tickGain = audioCtx.createGain();
        tick.type = 'square';
        tick.connect(tickGain);
        tickGain.connect(audioCtx.destination);

        if (type === 'blue') {
          tick.frequency.setValueAtTime(1500, t); tick.frequency.exponentialRampToValueAtTime(100, t + 0.02);
          tickGain.gain.setValueAtTime(0.15, t); tickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
          thock.frequency.setValueAtTime(300, t); thock.frequency.exponentialRampToValueAtTime(50, t + 0.04);
          thockGain.gain.setValueAtTime(0.3, t); thockGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        } else if (type === 'red') {
          tickGain.gain.setValueAtTime(0, t); 
          thock.frequency.setValueAtTime(200, t); thock.frequency.exponentialRampToValueAtTime(40, t + 0.04);
          thockGain.gain.setValueAtTime(0.2, t); thockGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        } else if (type === 'black') {
          tickGain.gain.setValueAtTime(0, t);
          thock.frequency.setValueAtTime(150, t); thock.frequency.exponentialRampToValueAtTime(30, t + 0.05);
          thockGain.gain.setValueAtTime(0.4, t); thockGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        } else {
          tick.frequency.setValueAtTime(800, t); tick.frequency.exponentialRampToValueAtTime(100, t + 0.03);
          tickGain.gain.setValueAtTime(0.05, t); tickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
          thock.frequency.setValueAtTime(250, t); thock.frequency.exponentialRampToValueAtTime(50, t + 0.04);
          thockGain.gain.setValueAtTime(0.3, t); thockGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        }
        tick.start(t); tick.stop(t + 0.05);
        thock.start(t); thock.stop(t + 0.06);
      } catch(e) {}
    }

    // --- DATA ---
    const getSafeImages = (id) => [
      `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=800&h=800&q=80`,
      `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=800&h=800&q=80`,
      `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=800&h=800&q=80`
    ];

    const initialProducts = [
      { id: 1, title: "Kreo Hive Mechanical Keyboard", price: 3499, category: "Keyboards", condition: "New", seller: "KreoOfficial", images: getSafeImages("1618384887929-16ec33fab9ef"), description: "The aesthetic Kreo Hive with Outemu Red linear switches. Hot-swappable, per-key RGB, and a transparent casing." },
      { id: 2, title: "Keychron Q1 Pro Wireless", price: 14999, category: "Keyboards", condition: "Like New", seller: "TechVibes99", images: getSafeImages("1595225476474-87563907a212"), description: "Fully assembled, banana switches. Used for a week, immaculate vibes." },
      { id: 3, title: "LG 34\" UltraWide Monitor", price: 29999, category: "Monitors", condition: "Good", seller: "DeskSpaces", images: getSafeImages("1527443224154-c4a3942d3acf"), description: "God-tier ultrawide for productivity and gaming." },
      { id: 4, title: "Walnut Desk Shelf", price: 18000, category: "Accessories", condition: "Excellent", seller: "WoodWorkerMac", images: getSafeImages("1499951360447-b19be8fe80f5"), description: "Elevates the monitor and hides the mess." },
      { id: 5, title: "Logitech MX Master 3S", price: 7999, category: "Mice", condition: "New", seller: "ClickySwitch", images: getSafeImages("1615663245857-ac93bb7c39e7"), description: "Unopened. Bought by mistake. The GOAT of productivity mice." },
      { id: 6, title: "Custom Coiled Aviator Cable", price: 2500, category: "Customization", condition: "New", seller: "CableModder", images: getSafeImages("1518770660439-4636190af475"), description: "USB-C to USB-A coiled tech cable." },
      { id: 7, title: "Grovemade Wool Desk Pad", price: 3999, category: "Accessories", condition: "Good", seller: "AestheticSetup", images: getSafeImages("1593640408182-31c70c8268f5"), description: "Premium merino wool." },
      { id: 8, title: "Elgato Wave:3 Microphone", price: 9999, category: "Audio", condition: "Like New", seller: "StreamerBoy", images: getSafeImages("1590602847861-f357a9332bbc"), description: "Perfect for streaming or Zoom calls." },
      { id: 9, title: "Govee Glide Hexa Light Panels", price: 11999, category: "Lighting", condition: "New", seller: "RgbEnthusiast", images: getSafeImages("1550745165-9bc0b252726f"), description: "Complete set of 10 with all adhesives intact." },
      { id: 10, title: "Sony WH-1000XM5", price: 24999, category: "Audio", condition: "Like New", seller: "Audiophile", images: getSafeImages("1618366712010-f4ae9c647dcb"), description: "Incredible noise cancellation." }
    ];

    const rareItems = [
      { id: 101, title: "TGR Jane V2 CE Keyboard", currentBid: 350000, endsIn: "02h 15m 30s", bids: 42, image: "https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=800&q=80", description: "The holy grail of custom mechanical keyboards. Pristine condition, unbuilt." },
      { id: 102, title: "Sealed Keycult No. 1/65", currentBid: 280000, endsIn: "05h 42m 10s", bids: 28, image: "https://images.unsplash.com/photo-1600465224376-857c50a11fc5?auto=format&fit=crop&w=800&q=80", description: "Black and Brass unbuilt kit. Comes with the original authenticity card." }
    ];

    const testimonials = [
      { name: "Sarah Jenkins", handle: "@sarahcodes", avatar: "Sarah", text: "Got my Kreo Hive for a steal. The escrow payment made me feel super safe.", rating: 5 },
      { name: "Marcus Thorne", handle: "@marcus_wfh", avatar: "Marcus", text: "Sold my ultrawide monitor in two days. Zero lowballers.", rating: 5 },
      { name: "Elena Rodriguez", handle: "@elenadesks", avatar: "Elena", text: "The aesthetic of this site matches the setups we buy.", rating: 5 }
    ];

    const sellers = [ 
      {name: "TechVibes99", img: "Felix", sales: 142}, {name: "KeebNerd", img: "Aneka", sales: 89}, 
      {name: "DeskSpaces", img: "Jude", sales: 304}, {name: "AudioGod", img: "Milo", sales: 56}, {name: "CableModder", img: "Leo", sales: 211}
    ];

    const categories = ["All", "Keyboards", "Monitors", "Customization", "Audio", "Accessories", "Lighting"];

    // --- STATE ---
    let state = {
      view: 'auth', // Starts logged out
      isDark: false,
      isLoggedIn: false,
      accountType: 'Buyer',
      userProfile: { username: '', email: '', shopName: '', upiId: '' },
      products: [...initialProducts],
      activeCategory: 'All',
      searchQuery: '',
      selectedProduct: null,
      activeImageIndex: 0,
      cart: [],
      authIsLogin: false,
      authTempType: 'Both'
    };

    // --- ACTIONS ---
    window.actions = {
      sound: (switchType = 'brown') => playSwitchSound(switchType),
      
      setView: (newView) => {
        state.view = newView;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      },

      toggleTheme: () => {
        state.isDark = !state.isDark;
        if(state.isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        renderApp();
      },

      setAuthMode: (isLogin) => { state.authIsLogin = isLogin; renderApp(); },
      setAuthType: (type) => { state.authTempType = type; renderApp(); },
      
      handleAuth: (e, form) => {
        e.preventDefault();
        const formData = new FormData(form);
        const email = formData.get('email');
        const rawUsername = formData.get('username') || (email ? email.split('@')[0] : 'user');
        const username = rawUsername.startsWith('@') ? rawUsername : `@${rawUsername}`;

        state.userProfile = {
          username, email,
          shopName: formData.get('shopName') || '',
          upiId: formData.get('upiId') || ''
        };
        state.accountType = state.authTempType;
        state.isLoggedIn = true;
        
        actions.setView('home');
        actions.showToast(`🎉 Welcome to SetupMarket, ${username}!`);
      },

      logout: () => {
        state.isLoggedIn = false;
        state.view = 'auth';
        renderApp();
        actions.showToast("Logged out successfully");
      },

      setCategory: (cat) => {
        state.activeCategory = cat;
        if(state.view === 'search') {
           document.getElementById('search-grid').innerHTML = renderSearchGrid();
           lucide.createIcons();
        } else {
           actions.setView('search');
        }
      },

      updateSearch: (val) => {
        state.searchQuery = val;
        // Targeted DOM update so input doesn't lose focus
        const grid = document.getElementById('search-grid');
        const count = document.getElementById('search-count');
        if(grid && count) {
          grid.innerHTML = renderSearchGrid();
          const filtered = getFilteredProducts();
          count.innerHTML = `Found ${filtered.length} items ${state.searchQuery ? `matching "${state.searchQuery}"` : ''}`;
          lucide.createIcons();
        }
      },

      focusSearch: () => {
        if(state.view !== 'search') {
          actions.setView('search');
          setTimeout(() => document.getElementById('main-search-input')?.focus(), 100);
        }
      },

      openProduct: (id) => {
        state.selectedProduct = state.products.find(p => p.id === id);
        state.activeImageIndex = 0;
        actions.setView('product');
      },

      setImage: (idx) => {
        state.activeImageIndex = idx;
        const img = document.getElementById('product-main-img');
        if(img && state.selectedProduct) {
          img.src = state.selectedProduct.images[idx];
          // Update active border classes manually
          document.querySelectorAll('.thumb-btn').forEach((btn, i) => {
            if(i === idx) {
              btn.classList.add('border-pink-500', 'scale-105', 'shadow-[0_0_20px_rgba(236,72,153,0.4)]');
              btn.classList.remove('border-transparent', 'opacity-60');
            } else {
              btn.classList.remove('border-pink-500', 'scale-105', 'shadow-[0_0_20px_rgba(236,72,153,0.4)]');
              btn.classList.add('border-transparent', 'opacity-60');
            }
          });
        }
      },

      addToCart: (id) => {
        const prod = state.products.find(p => p.id === id) || rareItems.find(p => p.id === id);
        if(prod) {
          state.cart.push(prod);
          renderApp();
          actions.showToast(`🛒 Snagged: ${prod.title}`);
        }
      },

      removeFromCart: (index) => {
        state.cart.splice(index, 1);
        renderApp();
        actions.showToast(`🗑️ Removed from cart`);
      },

      addListing: (e, form) => {
        e.preventDefault();
        const fd = new FormData(form);
        const userImg = fd.get('image');
        const newProd = {
          id: state.products.length + 1,
          title: fd.get('title'),
          price: parseFloat(fd.get('price')),
          category: fd.get('category'),
          condition: "New", // hardcoded for brevity in form
          seller: state.userProfile.username,
          images: userImg ? [userImg, userImg, userImg] : getSafeImages("1593640408182-31c70c8268f5"),
          description: fd.get('description')
        };
        state.products.unshift(newProd);
        actions.setView('home');
        actions.showToast("🚀 Listing dropped successfully!");
      },

      placeBid: (id, amount) => {
        actions.showToast(`💰 Outbid! Your bid for ₹${amount.toLocaleString('en-IN')} is active.`);
      },

      scrollContainer: (id, direction) => {
        const el = document.getElementById(id);
        if(el) el.scrollBy({ left: direction === 'left' ? -350 : 350, behavior: 'smooth' });
      },

      showToast: (msg) => {
        const tCont = document.getElementById('toast-container');
        const tMsg = document.getElementById('toast-message');
        tMsg.innerText = msg;
        tCont.classList.remove('hidden', 'opacity-0');
        tCont.classList.add('opacity-100', 'animate-bounce');
        
        setTimeout(() => {
          tCont.classList.remove('opacity-100', 'animate-bounce');
          tCont.classList.add('opacity-0');
          setTimeout(() => tCont.classList.add('hidden'), 300);
        }, 3000);
      }
    };

    // --- TEMPLATE RENDERING ---
    const formatPrice = (price) => Number(price).toLocaleString('en-IN');
    
    const getFilteredProducts = () => {
      return state.products.filter(p => {
        const matchCat = state.activeCategory === "All" || p.category === state.activeCategory;
        const matchSearch = p.title.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                            p.description.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });
    };

    const renderNav = () => {
      if(!state.isLoggedIn) return '';
      return `
        <nav class="relative z-40 bg-white/20 dark:bg-slate-900/40 backdrop-blur-xl border-b border-white/30 dark:border-slate-700/30 sticky top-0 px-4 sm:px-8 py-3 flex justify-between items-center shadow-sm transition-colors duration-500 gap-4">
          <div class="flex items-center cursor-pointer gap-2 group flex-shrink-0" onclick="actions.sound(); actions.setView('home')">
            <div class="bg-gradient-to-tr from-pink-500 to-cyan-500 p-2 rounded-2xl group-hover:rotate-12 transition-transform">
              <i data-lucide="monitor" class="h-6 w-6 text-white"></i>
            </div>
            <span class="font-black text-2xl tracking-tighter text-slate-800 dark:text-white hidden lg:block">
              Setup<span class="text-pink-500">Market</span>
            </span>
          </div>

          <div class="flex-1 max-w-2xl hidden sm:block">
            <div class="relative group w-full">
              <i data-lucide="search" class="absolute inset-y-0 left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400 dark:text-slate-500"></i>
              <input type="text" id="top-search"
                class="w-full pl-12 pr-4 py-2.5 rounded-full neumo-in text-slate-800 dark:text-white outline-none transition-all placeholder-slate-400 dark:placeholder-slate-500 font-bold"
                placeholder="Search keyboards, desks, keycaps..."
                value="${state.searchQuery}"
                oninput="actions.updateSearch(this.value)"
                onfocus="actions.focusSearch()"
              />
            </div>
          </div>

          <button onclick="actions.sound('blue'); actions.toggleTheme()" class="flex neumo-out p-3 rounded-full transition-all text-slate-600 dark:text-slate-300 hover:text-pink-500 flex-shrink-0 ml-auto sm:ml-0">
            ${state.isDark ? '<i data-lucide="sun" class="h-6 w-6 text-yellow-400"></i>' : '<i data-lucide="moon" class="h-6 w-6 text-indigo-500"></i>'}
          </button>
        </nav>
      `;
    };

    const renderBottomNav = () => {
      if(!state.isLoggedIn) return '';
      return `
        <div class="fixed bottom-4 sm:bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-white/40 dark:bg-slate-900/60 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 shadow-[0_20px_50px_rgba(0,0,0,0.1)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.5)] rounded-full px-4 sm:px-6 py-3 sm:py-4 flex items-center gap-4 sm:gap-10 w-auto whitespace-nowrap">
          <button onclick="actions.sound(); actions.setView('home')" class="p-2 transition-colors ${state.view === 'home' ? 'text-pink-500' : 'text-slate-600 dark:text-slate-400 hover:text-pink-400'}"><i data-lucide="home" class="h-6 w-6 sm:h-7 sm:w-7"></i></button>
          <button onclick="actions.sound(); actions.setView('search')" class="p-2 transition-colors ${state.view === 'search' ? 'text-cyan-500' : 'text-slate-600 dark:text-slate-400 hover:text-cyan-400'}"><i data-lucide="search" class="h-6 w-6 sm:h-7 sm:w-7"></i></button>
          <button onclick="actions.sound(); actions.setView('sell')" class="bg-gradient-to-tr from-pink-500 to-purple-500 text-white rounded-full p-3 sm:p-4 transform -translate-y-4 sm:-translate-y-6 shadow-[0_10px_20px_rgba(236,72,153,0.4)] hover:-translate-y-6 sm:hover:-translate-y-8 transition-all border-4 border-[#e0e5ec] dark:border-[#0f172a]"><i data-lucide="plus-circle" class="h-6 w-6 sm:h-8 sm:w-8"></i></button>
          <button onclick="actions.sound(); actions.setView('cart')" class="p-2 transition-colors relative ${state.view === 'cart' ? 'text-purple-500' : 'text-slate-600 dark:text-slate-400 hover:text-purple-400'}">
            <i data-lucide="shopping-cart" class="h-6 w-6 sm:h-7 sm:w-7"></i>
            ${state.cart.length > 0 ? `<span class="absolute top-0 right-0 inline-flex items-center justify-center h-4 w-4 sm:h-5 sm:w-5 text-[10px] sm:text-xs font-black text-white bg-pink-500 rounded-full border-2 border-white dark:border-slate-800 shadow-sm">${state.cart.length}</span>` : ''}
          </button>
          <button onclick="actions.sound(); actions.setView('profile')" class="p-2 transition-colors ${state.view === 'profile' ? 'text-pink-500' : 'text-slate-600 dark:text-slate-400 hover:text-pink-400'}"><i data-lucide="user" class="h-6 w-6 sm:h-7 sm:w-7"></i></button>
        </div>
      `;
    };

    const renderFooter = () => {
      if(!state.isLoggedIn) return '';
      return `
        <footer class="w-full pt-16 pb-32 relative z-10 bg-slate-800 dark:bg-[#0a0f18] text-slate-400 dark:text-slate-500 transition-colors duration-500 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] mt-12">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
              <div class="flex flex-col gap-4">
                <div class="flex items-center gap-2"><i data-lucide="monitor" class="h-6 w-6 text-pink-500"></i><span class="text-2xl font-black text-white">Setup<span class="text-pink-500">Market</span></span></div>
                <p class="text-sm font-medium leading-relaxed">The ultimate marketplace for techies. Built for the modern aesthetic.</p>
              </div>
              <div>
                <h4 class="text-white font-bold mb-4 uppercase tracking-wider text-sm">Shop Vibes</h4>
                <ul class="space-y-3 text-sm font-medium">
                  <li><button onclick="actions.sound(); actions.setCategory('Keyboards')" class="hover:text-pink-500 transition-colors">Mechanical Keyboards</button></li>
                  <li><button onclick="actions.sound(); actions.setCategory('Customization')" class="hover:text-cyan-500 transition-colors">Desk Customizations</button></li>
                </ul>
              </div>
              <div>
                <h4 class="text-white font-bold mb-4 uppercase tracking-wider text-sm">Support</h4>
                <ul class="space-y-3 text-sm font-medium">
                  <li><button onclick="actions.sound(); actions.setView('about')" class="hover:text-yellow-400 text-white font-bold transition-colors">About Us 🚀</button></li>
                  <li><button class="hover:text-pink-500 transition-colors">FAQ & Help Center</button></li>
                </ul>
              </div>
            </div>
          </div>
        </footer>
      `;
    };

    const renderAuth = () => `
      <div class="relative min-h-screen flex items-center justify-center pt-12 pb-12 z-20 w-full">
        <button onclick="actions.sound('blue'); actions.toggleTheme()" class="absolute top-6 right-6 flex neumo-out p-3 rounded-full transition-all text-slate-600 dark:text-slate-300 hover:text-pink-500">
          ${state.isDark ? '<i data-lucide="sun" class="h-6 w-6 text-yellow-400"></i>' : '<i data-lucide="moon" class="h-6 w-6 text-indigo-500"></i>'}
        </button>
        
        <div class="max-w-xl mx-auto px-4 w-full flex flex-col justify-center">

                ` : ''}
              </div>
              
              <div class="flex flex-col justify-center px-4">
                <div class="inline-flex items-center space-x-2 text-sm font-bold text-slate-500 dark:text-slate-300 mb-4 bg-white/40 dark:bg-slate-900/40 px-4 py-2 rounded-full w-fit border border-white/50 dark:border-slate-700/50">
                  <span>${p.category}</span><i data-lucide="chevron-right" class="h-4 w-4"></i><span class="text-pink-500">${p.condition}</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black text-slate-800 dark:text-white mb-4 tracking-tight">${p.title}</h1>
                <div class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-500 mb-6 drop-shadow-sm">
                  ₹${formatPrice(p.price)}
                </div>
                <p class="text-lg text-slate-600 dark:text-slate-300 font-medium leading-relaxed mb-8">${p.description}</p>
                <div class="flex gap-4 mt-auto">
                  <button onclick="actions.sound(); actions.addToCart(${p.id})" class="flex-1 bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white px-8 py-5 rounded-full font-black text-xl transition-all shadow-lg hover:shadow-pink-500/30 transform hover:-translate-y-1 flex justify-center items-center gap-3">
                    <i data-lucide="shopping-cart" class="h-6 w-6"></i> Cop This
                  </button>
                  <button onclick="actions.sound(); actions.showToast('💬 Sliding into DMs...')" class="px-8 py-5 rounded-full font-black text-xl neumo-out text-slate-600 dark:text-slate-300 transition-all hover:text-pink-500">
                    DM Seller
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    const renderSell = () => `
      <div class="max-w-3xl mx-auto px-4 py-12 relative z-10 mb-32 min-h-screen">
        <div class="flex justify-between items-center mb-8 bg-white/40 dark:bg-slate-800/50 backdrop-blur-md px-8 py-4 rounded-full border border-white/50 dark:border-slate-700/50 shadow-sm">
          <h1 class="text-3xl font-black text-slate-800 dark:text-white">Drop a Listing 🚀</h1>
          <button onclick="actions.sound(); actions.setView('home')" class="text-slate-500 dark:text-slate-400 hover:text-pink-500 transition-colors"><i data-lucide="x" class="h-8 w-8"></i></button>
        </div>

        <form onsubmit="actions.sound('brown'); actions.addListing(event, this)" class="bg-white/50 dark:bg-slate-800/50 backdrop-blur-2xl p-8 md:p-12 rounded-[3rem] shadow-2xl border border-white/60 dark:border-slate-700/50">
          <div class="space-y-8">
            <div><label class="block text-sm font-black text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Listing Title</label><input required type="text" name="title" class="w-full p-4 rounded-2xl neumo-in text-slate-800 dark:text-white outline-none transition-all font-bold" placeholder="e.g., Kreo Mechanical Keyboard" /></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div><label class="block text-sm font-black text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Price (₹)</label><input required type="number" step="1" name="price" class="w-full p-4 rounded-2xl neumo-in text-slate-800 dark:text-white outline-none transition-all font-bold" placeholder="0" /></div>
              <div><label class="block text-sm font-black text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Category</label>
                <select name="category" class="w-full p-4 rounded-2xl neumo-in text-slate-800 dark:text-white outline-none transition-all font-bold appearance-none">
                  ${categories.filter(c => c !== "All").map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
              </div>
            </div>
            <div><label class="block text-sm font-black text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Primary Image URL (Optional)</label><input type="url" name="image" class="w-full p-4 rounded-2xl neumo-in text-slate-800 dark:text-white outline-none transition-all font-bold" placeholder="https://..." /></div>
            <div><label class="block text-sm font-black text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">The Vibes (Description)</label><textarea required name="description" rows="4" class="w-full p-4 rounded-2xl neumo-in text-slate-800 dark:text-white outline-none transition-all font-bold resize-none" placeholder="Is it pristine? Is it scuffed? Let 'em know..."></textarea></div>
            <button type="submit" class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 hover:from-pink-600 hover:to-cyan-600 text-white font-black py-5 rounded-full transition-all text-xl shadow-xl transform hover:-translate-y-1">Publish Listing ✨</button>
          </div>
        </form>
      </div>
    `;

    const renderCart = () => {
      const total = state.cart.reduce((s, i) => s + i.price, 0);
      return `
        <div class="max-w-5xl mx-auto px-4 py-12 relative z-10 mb-32 min-h-screen">
          <div class="flex justify-between items-center mb-8"><h1 class="text-4xl font-black text-slate-800 dark:text-white">Your Cart 🛍️</h1></div>
          ${state.cart.length === 0 ? `
            <div class="bg-white/50 dark:bg-slate-800/50 backdrop-blur-2xl p-16 text-center rounded-[3rem] border border-white/60 dark:border-slate-700/50 shadow-xl">
              <i data-lucide="package" class="h-24 w-24 text-pink-300 mx-auto mb-6"></i>
              <h2 class="text-3xl font-black text-slate-800 dark:text-white mb-4">It's giving... empty.</h2>
              <button onclick="actions.sound(); actions.setView('search')" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-8 py-4 rounded-full font-black text-lg shadow-lg transform hover:-translate-y-1 transition-all">Start Browsing</button>
            </div>
          ` : `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div class="lg:col-span-2 space-y-6">
                ${state.cart.map((item, index) => `
                  <div class="flex flex-col sm:flex-row p-4 sm:p-6 bg-white/60 dark:bg-slate-800/60 backdrop-blur-xl rounded-[2rem] border border-white/60 dark:border-slate-700/50 shadow-lg gap-4 sm:gap-6 items-center sm:items-stretch text-center sm:text-left">
                    <img src="${item.images ? item.images[0] : item.image}" alt="${item.title}" class="w-full sm:w-32 h-48 sm:h-32 object-cover rounded-[1.5rem] shadow-inner dark:shadow-black/50" />
                    <div class="flex-1 flex flex-col w-full">
                      <h3 class="font-black text-xl text-slate-800 dark:text-white mb-1">${item.title}</h3>
                      <p class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-3 sm:mb-auto">By ${item.seller || 'Auctioneer'}</p>
                      <div class="flex justify-between items-center mt-2 sm:mt-0">
                        <span class="font-black text-2xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">₹${formatPrice(item.price || item.currentBid)}</span>
                        <button onclick="actions.sound(); actions.removeFromCart(${index})" class="neumo-out text-red-500 px-4 py-2 rounded-full font-bold transition-all">Remove</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="bg-white/60 dark:bg-slate-800/60 backdrop-blur-xl p-8 rounded-[3rem] border border-white/60 dark:border-slate-700/50 shadow-2xl h-fit">
                <h3 class="text-2xl font-black text-slate-800 dark:text-white mb-6">The Damage 💸</h3>
                <div class="space-y-4 mb-8 font-bold text-slate-600 dark:text-slate-300">
                  <div class="flex justify-between"><span>Subtotal (${state.cart.length} items)</span><span>₹${formatPrice(total)}</span></div>
                  <div class="flex justify-between"><span>GST (18%)</span><span>₹${formatPrice((total * 0.18).toFixed(0))}</span></div>
                  <div class="border-t-2 border-slate-200/50 dark:border-slate-700/50 pt-4 flex justify-between font-black text-2xl text-slate-800 dark:text-white"><span>Total</span><span>₹${formatPrice((total * 1.18).toFixed(0))}</span></div>
                </div>
                <button onclick="actions.sound(); actions.showToast('💳 Secure checkout initialized...')" class="w-full bg-gradient-to-r from-pink-500 to-cyan-500 text-white font-black py-5 rounded-full shadow-lg transform hover:-translate-y-1 transition-all text-xl">Checkout Now</button>
              </div>
            </div>
          `}
        </div>
      `;
    };

    const renderProfile = () => `
      <div class="max-w-4xl mx-auto px-4 py-12 relative z-10 mb-32 min-h-screen">
        <div class="bg-white/50 dark:bg-slate-800/50 backdrop-blur-2xl border border-white/60 dark:border-slate-700/50 rounded-[3rem] p-8 md:p-16 shadow-2xl flex flex-col items-center text-center">
          <div class="relative">
            <div class="w-40 h-40 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-500 p-1.5 shadow-xl mb-6">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=GenZ&backgroundColor=e0e5ec" alt="Avatar" class="w-full h-full bg-white dark:bg-slate-900 rounded-full object-cover" />
            </div>
            <div class="absolute bottom-6 right-0 bg-white dark:bg-slate-800 rounded-full p-1 shadow-md">
              <i data-lucide="badge-check" class="h-8 w-8 text-blue-500"></i>
            </div>
          </div>
          
          <h1 class="text-4xl md:text-5xl font-black text-slate-800 dark:text-white mb-2">Main Character Energy ✨</h1>
          
          <div class="flex flex-col items-center gap-2 text-lg text-slate-500 dark:text-slate-400 font-bold mb-4">
            <div class="flex items-center gap-4">
              <span>${state.userProfile.username}</span> • <span class="flex items-center gap-1"><i data-lucide="map-pin" class="h-4 w-4"></i> Bangalore, IN</span>
            </div>
            <span class="text-sm font-medium">${state.userProfile.email}</span>
            ${(state.accountType === 'Seller' || state.accountType === 'Both') && state.userProfile.shopName ? `
               <span class="text-sm font-black text-pink-500 mt-1">🏪 ${state.userProfile.shopName}</span>
            ` : ''}
          </div>
          
          <div class="bg-pink-100 dark:bg-pink-900/40 text-pink-600 dark:text-pink-400 px-4 py-1.5 rounded-full font-black text-sm uppercase mb-6 tracking-wide border border-pink-200 dark:border-pink-800">
            Account Type: ${state.accountType}
          </div>

          <p class="text-slate-600 dark:text-slate-300 font-medium max-w-lg mb-10 italic">
            "Mech keeb enthusiast and ultrawide advocate. I only buy and sell premium, aesthetic gear. No lowballers."
          </p>
          
          <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 w-full max-w-lg">
              <div class="flex-1 neumo-in rounded-[2rem] p-6">
                <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500">12</div>
                <div class="text-sm font-black text-slate-500 dark:text-slate-400 mt-1 uppercase">Items Snagged</div>
              </div>
              <div class="flex-1 neumo-in rounded-[2rem] p-6">
                <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-blue-500">₹3.5L</div>
                <div class="text-sm font-black text-slate-500 dark:text-slate-400 mt-1 uppercase">Bag Secured</div>
              </div>
          </div>

          <button onclick="actions.sound(); actions.setView('rare-collection')" class="mt-10 w-full max-w-lg bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black py-5 rounded-[2rem] shadow-[0_0_30px_rgba(245,158,11,0.4)] hover:shadow-[0_0_40px_rgba(245,158,11,0.6)] transform hover:-translate-y-1 transition-all flex items-center justify-center gap-3 text-xl border-2 border-amber-300">
            <i data-lucide="gem" class="h-7 w-7"></i> Enter The Vault (Rare Bidding)
          </button>

          <button onclick="actions.sound(); actions.logout()" class="mt-8 text-slate-500 dark:text-slate-400 font-bold hover:text-red-500 transition-colors">
            Log Out
          </button>
        </div>
    </div>
  `;

  const renderRare = () => `
    <div class="max-w-7xl mx-auto px-4 py-12 relative z-10 mb-32 min-h-screen">
        <button onclick="actions.sound(); actions.setView('profile')" class="flex items-center text-slate-500 dark:text-slate-300 font-bold hover:text-amber-500 mb-8 transition-colors bg-white/30 dark:bg-slate-800/50 backdrop-blur-md px-6 py-3 rounded-full border border-white/40 dark:border-slate-700/50 w-fit shadow-sm">
          <i data-lucide="user" class="h-5 w-5 mr-2"></i> Back to Profile
        </button>

        <div class="text-center mb-16">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-tr from-amber-400 to-orange-600 mb-6 shadow-[0_0_40px_rgba(245,158,11,0.5)]">
            <i data-lucide="gem" class="h-10 w-10 text-white"></i>
          </div>
          <h1 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 tracking-tighter uppercase mb-4">
            The Vault
          </h1>
          <p class="text-xl text-slate-600 dark:text-slate-300 font-bold max-w-2xl mx-auto">
            Exclusive live auctions for the rarest desk setups and enthusiast gear on the planet.
          </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
          ${rareItems.map(item => `
            <div class="bg-slate-900 rounded-[3rem] p-4 border-2 border-amber-500/30 shadow-[0_0_30px_rgba(245,158,11,0.15)] flex flex-col group relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-b from-amber-500/10 to-transparent pointer-events-none"></div>
              <div class="relative h-72 w-full rounded-[2.5rem] overflow-hidden mb-6 shadow-inner">
                <div class="absolute top-4 left-4 bg-red-500/90 backdrop-blur text-white px-4 py-2 rounded-full text-sm font-black flex items-center gap-2 z-10 animate-pulse">
                  <span class="w-2 h-2 rounded-full bg-white"></span> Live Auction
                </div>
                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-90" />
              </div>
              <div class="px-6 pb-6 flex flex-col flex-1 relative z-10">
                <h3 class="text-3xl font-black text-white mb-2">${item.title}</h3>
                <p class="text-slate-400 font-medium mb-8 leading-relaxed">${item.description}</p>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 bg-black/40 p-5 sm:p-6 rounded-3xl border border-white/5 gap-4 sm:gap-0 w-full">
                  <div>
                    <div class="text-slate-500 font-bold text-sm uppercase mb-1">Current Highest Bid</div>
                    <div class="text-4xl font-black text-amber-400">₹${formatPrice(item.currentBid)}</div>
                    <div class="text-sm font-bold text-slate-400 mt-2">${item.bids} Bids placed</div>
                  </div>
                  <div class="text-left sm:text-right w-full sm:w-auto border-t border-white/10 sm:border-t-0 pt-4 sm:pt-0 mt-2 sm:mt-0">
                    <div class="text-slate-500 font-bold text-sm uppercase mb-1">Ends In</div>
                    <div class="text-2xl font-black text-white font-mono">${item.endsIn}</div>
                  </div>
                </div>
                <button onclick="actions.sound(); actions.placeBid(${item.id}, ${item.currentBid})" class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black py-5 rounded-full transition-all text-xl shadow-lg hover:shadow-orange-500/40 transform hover:-translate-y-1 flex items-center justify-center gap-3">
                  <i data-lucide="gavel" class="h-6 w-6"></i> Place Bid (+₹5,000)
                </button>
              </div>
            </div>
          `).join('')}
        </div>
    </div>
  `;

  const renderAbout = () => `
    <div class="max-w-6xl mx-auto px-4 py-12 relative z-10 mb-32 min-h-screen">
        <div class="bg-white/50 dark:bg-slate-800/50 backdrop-blur-2xl border border-white/60 dark:border-slate-700/50 rounded-[3rem] p-8 md:p-16 shadow-2xl flex flex-col items-center text-center mb-16">
          <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-500 to-purple-500 p-1.5 shadow-xl mb-8 flex items-center justify-center"><i data-lucide="sparkles" class="h-10 w-10 text-white"></i></div>
          <h1 class="text-4xl md:text-5xl font-black text-slate-800 dark:text-white mb-6 tracking-tight">About SetupMarket 🚀</h1>
          <p class="text-lg md:text-xl text-slate-600 dark:text-slate-300 font-medium leading-relaxed mb-10 max-w-3xl">We built SetupMarket because we were tired of generic marketplaces. We wanted a dedicated, aesthetic space for tech enthusiasts to buy, sell, and flex their desk setups. No cap. Just pure vibes.</p>
        </div>
    </div>
  `;

    // --- MAIN RENDERER ---
    function renderApp() {
      const root = document.getElementById('app');
      
      if (!state.isLoggedIn) {
        root.innerHTML = renderAuth();
      } else {
        let viewHtml = '';
        if (state.view === 'home') viewHtml = renderHome();
        if (state.view === 'search') viewHtml = renderSearch();
        if (state.view === 'product') viewHtml = renderProduct();
        if (state.view === 'sell') viewHtml = renderSell();
        if (state.view === 'cart') viewHtml = renderCart();
        if (state.view === 'profile') viewHtml = renderProfile();
        if (state.view === 'rare-collection') viewHtml = renderRare();
        if (state.view === 'about') viewHtml = renderAbout();

        root.innerHTML = `
          ${renderNav()}
          <main class="min-h-[80vh]">
            ${viewHtml}
          </main>
          ${renderBottomNav()}
          ${renderFooter()}
        `;
      }
      
      // Render Lucide Icons
      lucide.createIcons();
    }

    // Initial render
    renderApp();
  </script>
</body>
</html>
